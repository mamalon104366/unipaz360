name: Defecto
description: Algo que no funciona como dicen los criterios de aceptación
title: "BUG: "
labels: ["defecto"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir ... 2. Buscar ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperaba y qué pasó
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Teléfono y versión de Android
  - type: dropdown
    id: conexion
    attributes:
      label: ¿Con o sin conexión?
      options: [Sin conexión (modo avión), Con conexión]

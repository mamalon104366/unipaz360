name: Tarea técnica
description: Trabajo necesario que el usuario no ve (configuración, modelo de datos, infraestructura)
title: "TEC-XX: "
labels: ["tecnica"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué hay que hacer
    validations:
      required: true
  - type: textarea
    id: terminado
    attributes:
      label: Cómo sabemos que está terminada
      value: |
        - [ ] ...
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad (MoSCoW)
      options: [Must, Should, Could]
    validations:
      required: true

name: unipaz360
description: "Orientación en el Centro de Investigaciones Santa Lucía de UNIPAZ."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.1
  provider: ^6.1.5
  go_router: ^17.5.0
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  url_launcher: ^6.3.3
  web: ^1.1.1
  internet_connection_checker_plus: 3.1.2
  webview_flutter: ^4.14.1
  cupertino_icons: ^2.0.0
  sqlite3: ^3.9.0
  path_provider: ^2.1.6
  lucide_icons_flutter: ^4.0.2
  video_player_win: ^3.3.1
  typed_data: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/panoramas/
    - assets/imagenes/
    - assets/videos/
    # La configuración por defecto del apartado Cliente (panel/scripts/config-app-flutter.mjs).
    - assets/config/
    # La semilla: el paquete con el que arranca la app sin internet (panel/scripts/semilla-app.mjs).
    - assets/paquete/
    - assets/paquete/medios/
  # Las mismas fuentes que la vista Cliente del panel (variables, recortadas al alfabeto
  # latino de Google Fonts). Cada peso apunta al mismo archivo para que Flutter no invente
  # negritas; el grosor real lo pone el eje `wght` (ver estiloTexto()).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fuentes/Roboto.ttf
          weight: 400
        - asset: assets/fuentes/Roboto.ttf
          weight: 500
        - asset: assets/fuentes/Roboto.ttf
          weight: 600
        - asset: assets/fuentes/Roboto.ttf
          weight: 700
        - asset: assets/fuentes/Roboto.ttf
          weight: 800
    - family: NotoSerif
      fonts:
        - asset: assets/fuentes/NotoSerif.ttf
          weight: 400
        - asset: assets/fuentes/NotoSerif.ttf
          weight: 500
        - asset: assets/fuentes/NotoSerif.ttf
          weight: 600
        - asset: assets/fuentes/NotoSerif.ttf
          weight: 700
        - asset: assets/fuentes/NotoSerif.ttf
          weight: 800
        - asset: assets/fuentes/NotoSerif-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fuentes/NotoSerif-Italic.ttf
          style: italic
          weight: 500
        - asset: assets/fuentes/NotoSerif-Italic.ttf
          style: italic
          weight: 600
        - asset: assets/fuentes/NotoSerif-Italic.ttf
          style: italic
          weight: 700
        - asset: assets/fuentes/NotoSerif-Italic.ttf
          style: italic
          weight: 800

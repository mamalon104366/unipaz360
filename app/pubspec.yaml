name: unipaz360
description: "Orientación en el Centro de Investigaciones Santa Lucía de UNIPAZ."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.1
  provider: ^6.1.5
  go_router: ^17.5.0
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  url_launcher: ^6.3.3
  web: ^1.1.1
  internet_connection_checker_plus: 3.1.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/panoramas/
    - assets/imagenes/
    - assets/videos/
